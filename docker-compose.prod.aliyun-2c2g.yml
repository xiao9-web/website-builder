# Website Builder - Aliyun 2c2g production practice stack
# Target: ECS 2 vCPU / 2 GiB RAM / 40 GiB disk / Ubuntu 22.04

name: website-builder-prod

services:
  postgres:
    image: postgres:15-alpine
    container_name: wb-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "max_connections=40"
    volumes:
      - wb_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 384m
    networks:
      - wb-prod

  redis:
    image: redis:7-alpine
    container_name: wb-prod-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "128mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
    volumes:
      - wb_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 192m
    networks:
      - wb-prod

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: website-builder-server:prod-aliyun-2c2g
    container_name: wb-prod-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      SERVER_PORT: 8080
      UPLOAD_DIR: /var/data/uploads
      MEDIA_BASE_URL: ${PUBLIC_BASE_URL}/uploads
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m"
    volumes:
      - wb_prod_uploads:/var/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 60s
    mem_limit: 768m
    networks:
      - wb-prod

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}/api
    image: website-builder-web:prod-aliyun-2c2g
    container_name: wb-prod-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_BASE_URL}/api
      INTERNAL_API_URL: http://server:8080/api
      NODE_OPTIONS: "--max-old-space-size=256"
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/login >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 45s
    mem_limit: 512m
    networks:
      - wb-prod

  nginx:
    image: nginx:1.26-alpine
    container_name: wb-prod-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/aliyun-2c2g/nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz | grep -q ok"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 96m
    networks:
      - wb-prod

volumes:
  wb_prod_postgres_data:
  wb_prod_redis_data:
  wb_prod_uploads:

networks:
  wb-prod:
    driver: bridge
