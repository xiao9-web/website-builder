apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-builder-server
  namespace: website-builder
  labels:
    app.kubernetes.io/name: website-builder
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: website-builder
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website-builder
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: website-builder-server:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: website-builder-config
            - secretRef:
                name: website-builder-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: website-builder-server
  namespace: website-builder
  labels:
    app.kubernetes.io/name: website-builder
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: website-builder
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
      targetPort: http
