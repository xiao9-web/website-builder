apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-builder-web
  namespace: website-builder
  labels:
    app.kubernetes.io/name: website-builder
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: website-builder
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: website-builder
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: website-builder-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          envFrom:
            - configMapRef:
                name: website-builder-config
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: website-builder-web
  namespace: website-builder
  labels:
    app.kubernetes.io/name: website-builder
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: website-builder
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
