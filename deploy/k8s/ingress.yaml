apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website-builder
  namespace: website-builder
  labels:
    app.kubernetes.io/name: website-builder
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: website-builder.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: website-builder-server
                port:
                  name: http
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: website-builder-server
                port:
                  name: http
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: website-builder-server
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website-builder-web
                port:
                  name: http
