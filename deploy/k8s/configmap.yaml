apiVersion: v1
kind: ConfigMap
metadata:
  name: website-builder-config
  namespace: website-builder
  labels:
    app.kubernetes.io/name: website-builder
data:
  SPRING_PROFILES_ACTIVE: "dev"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.example.internal:5432/website_builder"
  SPRING_DATA_REDIS_HOST: "redis.example.internal"
  SPRING_DATA_REDIS_PORT: "6379"
  MEDIA_BASE_URL: "http://website-builder.local/uploads"
  NEXT_PUBLIC_API_URL: "http://website-builder.local/api"
  INTERNAL_API_URL: "http://website-builder-server:8080/api"
