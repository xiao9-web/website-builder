# Production template; do not load until filing, TLS certificates and both upstreams are verified.
# Install inside nginx's http context (for example /etc/nginx/conf.d/chunchang.conf).
# Replace SERVER_PUBLIC_IP and certificate paths before loading this template.

limit_req_zone $binary_remote_addr zone=company_inquiry:10m rate=5r/m;

# Reject unspecified host names. Access through the server's exact public IP goes to the blog.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name SERVER_PUBLIC_IP;

    location / {
        # Confirm the blog actually listens here before loading this configuration.
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name chunchang.tech www.chunchang.tech;
    return 308 https://www.chunchang.tech$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/www.chunchang.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.chunchang.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 443 ssl;
    server_name chunchang.tech;
    ssl_certificate /etc/letsencrypt/live/www.chunchang.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.chunchang.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://www.chunchang.tech$request_uri;
}

server {
    listen 443 ssl;
    server_name www.chunchang.tech;
    ssl_certificate /etc/letsencrypt/live/www.chunchang.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.chunchang.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This app has a single trusted reverse proxy; discard client-supplied forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;

    location = /api/purchase-inquiry {
        limit_req zone=company_inquiry burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3001;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
    }
}
