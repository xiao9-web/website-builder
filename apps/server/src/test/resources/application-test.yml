spring:
  datasource:
    url: jdbc:h2:mem:website_builder_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 100ms

logging:
  level:
    com.xiao9.wb: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
