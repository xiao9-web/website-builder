# Website Builder - Full Local Demo Stack
# PostgreSQL + Redis + Spring Boot backend + Next.js frontend

services:
  postgres:
    image: postgres:15-alpine
    container_name: wb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: website_builder
      POSTGRES_USER: wb_user
      POSTGRES_PASSWORD: wb_pass
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wb_user -d website_builder"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - wb-network

  redis:
    image: redis:6-alpine
    container_name: wb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - wb-network

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: website-builder-server:local
    container_name: wb-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/website_builder
      SPRING_DATASOURCE_USERNAME: wb_user
      SPRING_DATASOURCE_PASSWORD: wb_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: local-docker-demo-secret-key-change-before-production-32chars
      MEDIA_BASE_URL: http://localhost:8080/uploads
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - wb-network

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    image: website-builder-web:local
    container_name: wb-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      INTERNAL_API_URL: http://server:8080/api
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/login >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - wb-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  wb-network:
    driver: bridge
